seed: 42

model:
  name: mobilenet_v3_small
  pretrained: true
  num_classes: 5
  dropout: 0.2

data:
  batch_size: 32
  num_workers: 0

training:
  max_epochs: 20
  learning_rate: 0.001
  weight_decay: 0.0001

loss:
  name: weighted_cross_entropy
  class_weight_strategy: sqrt_inverse_frequency
  label_smoothing: 0.0

optimizer:
  name: adamw

scheduler:
  name: reduce_on_plateau
  mode: min
  monitor: val_loss
  factor: 0.3
  patience: 2
  min_lr: 0.000001

early_stopping:
  enabled: true
  monitor: val_macro_f1
  mode: max
  patience: 5
  min_delta: 0.001

checkpointing:
  enabled: true
  monitor: val_macro_f1
  mode: max
  save_best_only: true
  directory: models/checkpoints

evaluation:
  primary_metric: macro_f1
  metrics:
    - accuracy
    - macro_f1
    - precision
    - recall
    - confusion_matrix

test:
  locked_until_final_evaluation: true